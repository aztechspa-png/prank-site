<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    font-family:"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:#0f1722;
}

/* TAPETA */

.wallpaper{
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
    url('https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=1920&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}

/* IKONY */

.icons{
    position:absolute;
    top:20px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    z-index:5;
}

.icon{
    width:90px;
    text-align:center;
    color:white;
    font-size:13px;
}

.icon img{
    width:52px;
    margin-bottom:6px;
    filter:drop-shadow(0 0 10px rgba(0,0,0,.4));
}

/* TASKBAR */

.taskbar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:54px;
    background:rgba(20,20,25,.72);
    backdrop-filter:blur(25px);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.center-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.tbicon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.tbicon:hover{
    background:rgba(255,255,255,.08);
}

.tbicon img{
    width:24px;
}

/* GODZINA */

.clock{
    position:absolute;
    right:20px;
    color:white;
    text-align:right;
    font-size:13px;
    line-height:1.2;
}

/* MENU START */

.start-menu{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%) scale(.95);
    width:620px;
    height:680px;
    border-radius:26px;
    background:rgba(28,28,34,.92);
    backdrop-filter:blur(35px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 60px rgba(0,0,0,.45);
    padding:28px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:50;
}

.start-menu.active{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) scale(1);
}

.search{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.05);
    height:48px;
    border-radius:12px;
    padding:0 18px;
    color:white;
    display:flex;
    align-items:center;
    margin-bottom:30px;
    font-size:15px;
}

.apps{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.app{
    height:90px;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    transition:.2s;
}

.app:hover{
    background:rgba(255,255,255,.08);
}

.app img{
    width:38px;
    margin-bottom:10px;
}

/* FAKE SHUTDOWN */

.shutdown{
    position:fixed;
    inset:0;
    background:#0078d7;
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:9999;
}

.loader{
    width:70px;
    height:70px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.2);
    border-top:5px solid white;
    animation:spin 1s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

.shutdown h1{
    font-weight:400;
    font-size:34px;
}

</style>
</head>

<body>

<div class="wallpaper"></div>

<div class="icons">

    <div class="icon">
        <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png">
        Kosz
    </div>

    <div class="icon">
        <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png">
        Chrome
    </div>

</div>

<div class="taskbar">

    <div class="center-icons">

        <div class="tbicon" id="startBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Windows_logo_-_2021.svg">
        </div>

        <div class="tbicon">
            <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png">
        </div>

        <div class="tbicon">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png">
        </div>

    </div>

    <div class="clock" id="clock"></div>

</div>

<div class="start-menu" id="startMenu">

    <div class="search">
        Wyszukaj aplikacje, ustawienia i dokumenty
    </div>

    <div class="apps">

        <div class="app">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Windows_logo_-_2021.svg">
            Start
        </div>

        <div class="app">
            <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png">
            Chrome
        </div>

        <div class="app">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png">
            Discord
        </div>

        <div class="app">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
            Word
        </div>

    </div>

</div>

<div class="shutdown" id="shutdown">
    <div class="loader"></div>
    <h1>Trwa zamykanie systemu Windows...</h1>
</div>

<script>

/* FULLSCREEN */

document.documentElement.requestFullscreen?.();

/* GODZINA */

function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString('pl-PL',{
        hour:'2-digit',
        minute:'2-digit'
    });

    const date = now.toLocaleDateString('pl-PL');

    document.getElementById("clock").innerHTML =
        `${time}<br>${date}`;
}

setInterval(updateClock,1000);
updateClock();

/* START MENU */

const startBtn = document.getElementById("startBtn");
const startMenu = document.getElementById("startMenu");

startBtn.onclick = () => {
    startMenu.classList.toggle("active");
}

/* FAKE SHUTDOWN AFTER TIME */

setTimeout(()=>{

    document.getElementById("shutdown").style.display = "flex";

},15000);

</script>

</body>
</html>
