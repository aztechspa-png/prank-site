<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>System Error</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: "Segoe UI", sans-serif;
        cursor:none;
    }

    body{
        background:#000;
        overflow:hidden;
        color:white;
    }

    .screen{
        position:fixed;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        background:#000;
        z-index:10;
    }

    .glitch{
        font-size:64px;
        font-weight:900;
        color:red;
        text-shadow:
            0 0 10px red,
            0 0 20px red,
            0 0 40px red;
        animation:glitch 0.08s infinite;
        letter-spacing:5px;
    }

    @keyframes glitch{
        0%{transform:translate(0)}
        20%{transform:translate(-3px,3px)}
        40%{transform:translate(3px,-3px)}
        60%{transform:translate(-4px,-2px)}
        80%{transform:translate(4px,2px)}
        100%{transform:translate(0)}
    }

    .sub{
        margin-top:25px;
        font-size:24px;
        opacity:0.8;
    }

    .shutdown{
        display:none;
        position:fixed;
        inset:0;
        background:#0078d7;
        color:white;
        z-index:20;
        flex-direction:column;
        align-items:center;
        justify-content:center;
    }

    .loader{
        width:80px;
        height:80px;
        border:6px solid rgba(255,255,255,.2);
        border-top:6px solid white;
        border-radius:50%;
        animation:spin 1s linear infinite;
        margin-bottom:30px;
    }

    @keyframes spin{
        100%{transform:rotate(360deg)}
    }

    .shutdown h1{
        font-size:42px;
        font-weight:400;
    }

    .percent{
        margin-top:20px;
        font-size:28px;
    }

    .bsod{
        display:none;
        position:fixed;
        inset:0;
        background:#0078d7;
        color:white;
        z-index:30;
        padding:80px;
    }

    .sad{
        font-size:120px;
        font-weight:200;
    }

    .bsodtext{
        margin-top:30px;
        font-size:32px;
        max-width:900px;
        line-height:1.4;
    }

    .small{
        margin-top:40px;
        font-size:20px;
        opacity:0.9;
    }
</style>
</head>

<body>

<div class="screen" id="warning">
    <div class="glitch">SYSTEM FAILURE</div>
    <div class="sub">Critical Windows Error Detected...</div>
</div>

<div class="shutdown" id="shutdown">
    <div class="loader"></div>
    <h1>Trwa zamykanie systemu Windows...</h1>
    <div class="percent" id="percent">0%</div>
</div>

<div class="bsod" id="bsod">
    <div class="sad">:(</div>

    <div class="bsodtext">
        Wystąpił problem i komputer musi zostać uruchomiony ponownie.
        Zbieramy informacje o błędzie, a następnie automatycznie wykonamy restart.
    </div>

    <div class="small">
        Stop Code: CRITICAL_PROCESS_DIED
    </div>
</div>

<audio autoplay loop>
    <source src="https://www.myinstants.com/media/sounds/windows-error.mp3" type="audio/mpeg">
</audio>

<script>

document.documentElement.requestFullscreen?.();

setTimeout(() => {
    document.getElementById("warning").style.display = "none";
    document.getElementById("shutdown").style.display = "flex";

    let p = 0;

    let interval = setInterval(() => {
        p++;

        document.getElementById("percent").innerText = p + "%";

        if(p >= 100){
            clearInterval(interval);

            document.getElementById("shutdown").style.display = "none";
            document.getElementById("bsod").style.display = "block";
        }

    }, 70);

}, 2500);

</script>

</body>
</html>
